<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte Globale</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Trebuchet MS",sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  overflow:hidden;
}

.main-container{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100vh;
  position:relative;
  z-index:2;
}

#total{
  font-size:18vw;
  font-weight:900;
  color:#00ff55;
  line-height:1;
  position:relative;
  z-index:3;
  transition:transform 0.3s ease,text-shadow 0.3s ease,color 0.5s ease;
  text-shadow:
    0 0 10px currentColor,
    0 0 25px currentColor,
    0 0 50px rgba(255,255,255,0.3);
}

.flash{
  transform:scale(1.05);
}

.palierFlash{
  animation:palierFlash 3s;
}

@keyframes palierFlash{
  0%{filter:brightness(1)}
  50%{filter:brightness(3)}
  100%{filter:brightness(1)}
}

.progress-bar{
  width:40px;
  height:70vh;
  background:#111;
  border-radius:20px;
  margin:0 50px;
  position:relative;
  overflow:hidden;
  box-shadow:
    inset 0 0 15px #000,
    0 0 20px rgba(0,255,85,0.25);
}

.progress-fill{
  position:absolute;
  bottom:0;
  width:100%;
  height:100%;
  background:linear-gradient(to top,#00ff55,#00ffaa);
  transition:height 0.6s ease, transform 0.6s ease;
}

.progress-bar.right .progress-fill{
  top:0;
  bottom:auto;
  transform-origin: top;
  transform: scaleY(1);
}

canvas{
  position:absolute;
  top:0;
  left:0;
  pointer-events:none;
  z-index:0;
}

</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="main-container">

<div class="progress-bar left">
  <div id="progressLeft" class="progress-fill"></div>
</div>

<div id="total">0</div>

<div class="progress-bar right">
  <div id="progressRight" class="progress-fill"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
  authDomain:"compteur-million-2.firebaseapp.com",
  databaseURL:"https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"compteur-million-2",
  storageBucket:"compteur-million-2.firebasestorage.app",
  messagingSenderId:"226299332536",
  appId:"1:226299332536:web:4d79be3a4ed0b2ba50714d"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const totalRef=ref(db,"total_global");
const campingRef=ref(db,"camping");

const totalDiv=document.getElementById("total");
const progressLeft=document.getElementById("progressLeft");
const progressRight=document.getElementById("progressRight");

const MAX_VALUE=1000000;

let previousValue=0;

/* CANVAS */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
let particles=[];

class Particle{
  constructor(x,y,color){
    this.x=x;
    this.y=y;
    const angle=Math.random()*Math.PI*2;
    const speed=Math.random()*6+2;
    this.vx=Math.cos(angle)*speed;
    this.vy=Math.sin(angle)*speed;
    this.alpha=1;
    this.color=color;
    this.size=Math.random()*3+2;
  }
  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.vy+=0.05;
    this.alpha-=0.015;
  }
  draw(){
    ctx.globalAlpha=this.alpha;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle=this.color;
    ctx.fill();
  }
}

function createExplosion(){
  const x=Math.random()*canvas.width;
  const y=Math.random()*canvas.height*0.6;
  const color=`hsl(${Math.random()*360},100%,60%)`;
  for(let i=0;i<70;i++){
    particles.push(new Particle(x,y,color));
  }
}

function animateFireworks(){
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  particles.forEach((p,index)=>{
    p.update();
    p.draw();
    if(p.alpha<=0) particles.splice(index,1);
  });
  requestAnimationFrame(animateFireworks);
}

animateFireworks();

/* CELEBRATION */
function megaCelebration(){
  let startTime=performance.now();
  function randomExplosion(){
    const now=performance.now();
    if(now-startTime>15000) return;
    createExplosion();
    const delay=100 + Math.random()*400;
    setTimeout(randomExplosion, delay);
  }
  randomExplosion();

  // Nettoyage discret après 15s
  setTimeout(()=>{ particles=[]; ctx.clearRect(0,0,canvas.width,canvas.height); },15000);
}

/* COMPTEUR */
function animateCounter(start,end,duration=800){
  const range=end-start;
  const startTime=performance.now();
  function updateCounter(currentTime){
    const elapsed=currentTime-startTime;
    const progress=Math.min(elapsed/duration,1);
    const value=Math.floor(start+range*progress);
    totalDiv.innerText=value.toLocaleString("fr-FR");
    if(progress<1) requestAnimationFrame(updateCounter);
  }
  requestAnimationFrame(updateCounter);
}

/* COULEUR */
function updateColor(value){
  if(value>=1000000) totalDiv.style.color="#FFD700";
  else if(value>=500000) totalDiv.style.color="#ff4444";
  else if(value>=100000) totalDiv.style.color="#ff8800";
  else if(value>=10000) totalDiv.style.color="#00aaff";
  else if(value>=1000) totalDiv.style.color="#bb66ff";
  else totalDiv.style.color="#00ff55";
}

/* FLASH PALIER */
function flashPalier(color){
  totalDiv.style.filter=`drop-shadow(0 0 20px ${color}) brightness(2)`;
  setTimeout(()=>{ totalDiv.style.filter=""; },3000);
}

/* TEMPS REEL */
onValue(totalRef,snapshot=>{
  const value=snapshot.val()||0;
  animateCounter(previousValue,value);

  if(value>previousValue){
    totalDiv.classList.add("flash");
    setTimeout(()=>totalDiv.classList.remove("flash"),200);
  }

  const percent=Math.min(value/MAX_VALUE,1);
  progressLeft.style.height=(percent*100)+"%";
  progressRight.style.transform="scaleY(" + (1-percent) + ")";

  updateColor(value);

  // Palier flash
  const paliers=[1000,10000,100000,500000];
  paliers.forEach(p=>{
    if(value>=p && previousValue<p){
      let color="";
      if(p===1000) color="#bb66ff";
      else if(p===10000) color="#00aaff";
      else if(p===100000) color="#ff8800";
      else if(p===500000) color="#ff4444";
      flashPalier(color);
    }
  });

  // Jackpot
  if(value>=1000000 && previousValue<1000000){
    megaCelebration();
  }

  previousValue=value;
});

/* RESET */
let leftClickCount=0;
document.body.addEventListener("click",e=>{
  if(e.clientX<100 && e.clientY<100){
    leftClickCount++;
    if(leftClickCount>=5){
      set(totalRef,0);
      set(campingRef,null);
      leftClickCount=0;
    }
  }else leftClickCount=0;
});

/* SOUSTRACTION */
let rightClickCount=0;
document.body.addEventListener("click",e=>{
  const width=window.innerWidth;
  if(e.clientX>width-100 && e.clientY<100){
    rightClickCount++;
    if(rightClickCount>=5){
      rightClickCount=0;
      get(totalRef).then(totalSnap=>{
        const total=totalSnap.val()||0;
        if(total<=0) return;
        const percent=0.12+Math.random()*0.04;
        const totalSubtract=Math.floor(total*percent);
        const subtractPerCamping=Math.floor(totalSubtract/12);
        get(campingRef).then(snapshot=>{
          const campings=snapshot.val()||{};
          const updates={};
          let newTotal=0;
          Object.keys(campings).forEach(key=>{
            const value=campings[key]||0;
            const newValue=Math.max(0,value-subtractPerCamping);
            updates[key]=newValue;
            newTotal+=newValue;
          });
          update(campingRef,updates);
          set(totalRef,newTotal);
        });
      });
    }
  }else rightClickCount=0;
});

</script>
</body>
</html>
