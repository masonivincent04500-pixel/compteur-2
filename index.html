<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte Globale</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Trebuchet MS",sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
overflow:hidden;
}

/* CONTENEUR */

.main-container{
display:flex;
align-items:center;
justify-content:center;
width:100%;
height:100vh;
}

/* CHIFFRE */

#total{
font-size:18vw;
font-weight:900;
line-height:1;

transition:
transform 0.3s ease,
text-shadow 0.3s ease,
color 0.5s ease;

text-shadow:
0 0 10px currentColor,
0 0 25px currentColor,
0 0 50px rgba(255,255,255,0.3);
}

.flash{
transform:scale(1.05);
}

.palier-flash{
animation:palierFlash 3s ease;
}

@keyframes palierFlash{

0%{
transform:scale(1);
text-shadow:0 0 20px currentColor;
}

50%{
transform:scale(1.12);
text-shadow:
0 0 60px currentColor,
0 0 120px currentColor;
}

100%{
transform:scale(1);
}

}

/* BARRES */

.progress-bar{

width:40px;
height:70vh;

background:#111;

border-radius:20px;

margin:0 50px;

position:relative;

overflow:hidden;

box-shadow:
inset 0 0 15px #000,
0 0 20px rgba(0,255,85,0.25);

}

.progress-fill{

position:absolute;
bottom:0;

width:100%;
height:0%;

background:linear-gradient(to top,#00ff55,#00ffaa);

transition:height 0.6s ease;

}

.progress-bar.right .progress-fill{

top:0;
bottom:auto;

}

/* FEUX D'ARTIFICE */

canvas{
position:absolute;
top:0;
left:0;
pointer-events:none;
}

</style>
</head>

<body>

<div class="main-container">

<div class="progress-bar left">
<div id="progressLeft" class="progress-fill"></div>
</div>

<div id="total">0</div>

<div class="progress-bar right">
<div id="progressRight" class="progress-fill"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
authDomain: "compteur-million-2.firebaseapp.com",
databaseURL: "https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "compteur-million-2",
storageBucket: "compteur-million-2.firebasestorage.app",
messagingSenderId: "226299332536",
appId: "1:226299332536:web:4d79be3a4ed0b2ba50714d"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db,"total_global");
const campingRef = ref(db,"camping");

const totalDiv=document.getElementById("total");

const progressLeft=document.getElementById("progressLeft");
const progressRight=document.getElementById("progressRight");

const MAX_VALUE=1000000;

let previousValue=0;

/* COMPTEUR ANIME */

function animateCounter(start,end,duration=800){

const range=end-start;
const startTime=performance.now();

function updateCounter(currentTime){

const elapsed=currentTime-startTime;
const progress=Math.min(elapsed/duration,1);

const value=Math.floor(start+range*progress);

totalDiv.innerText=value.toLocaleString("fr-FR");

if(progress<1)requestAnimationFrame(updateCounter);

}

requestAnimationFrame(updateCounter);

}

/* COULEUR SELON PALIER */

function getPalierColor(value){

if(value>=1000000) return "#FFD700";

if(value>=500000) return "#ff4444";

if(value>=100000) return "#ff8800";

if(value>=10000) return "#0080ff";   // BLEU

if(value>=1000) return "#8b2be2";    // VIOLET

return "#00ff55";

}

/* FLASH PALIER */

function flashPalier(color){

totalDiv.style.color=color;

totalDiv.classList.add("palier-flash");

setTimeout(()=>{

totalDiv.classList.remove("palier-flash");

},3000);

}

/* FEU D'ARTIFICE */

function launchFirework(){

const canvas=document.createElement("canvas");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

document.body.appendChild(canvas);

const ctx=canvas.getContext("2d");

const particles=[];

/* position départ (bas écran) */

let rocket={
x:Math.random()*canvas.width,
y:canvas.height,
vx:(Math.random()-0.5)*2,
vy:-8-Math.random()*4,
exploded:false
};

function animate(){

ctx.fillStyle="rgba(0,0,0,0.15)";
ctx.fillRect(0,0,canvas.width,canvas.height);

/* fusée */

if(!rocket.exploded){

rocket.x+=rocket.vx;
rocket.y+=rocket.vy;

rocket.vy+=0.05;

ctx.beginPath();
ctx.arc(rocket.x,rocket.y,3,0,Math.PI*2);
ctx.fillStyle="#ffffff";
ctx.fill();

/* explosion */

if(rocket.vy>=0){

rocket.exploded=true;

for(let i=0;i<80;i++){

particles.push({

x:rocket.x,
y:rocket.y,

angle:Math.random()*Math.PI*2,

speed:Math.random()*6+2,

radius:Math.random()*3+1,

life:100,

color:`hsl(${Math.random()*360},100%,60%)`

});

}

}

}

/* particules */

particles.forEach(p=>{

p.x+=Math.cos(p.angle)*p.speed;
p.y+=Math.sin(p.angle)*p.speed;

p.speed*=0.96;

p.angle+=0.01;

p.life--;

ctx.beginPath();
ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
ctx.fillStyle=p.color;
ctx.fill();

});

/* nettoyage */

for(let i=particles.length-1;i>=0;i--){

if(particles[i].life<=0){

particles.splice(i,1);

}

}

if(particles.length>0 || !rocket.exploded){

requestAnimationFrame(animate);

}else{

canvas.remove();

}

}

animate();

}

/* FEU D'ARTIFICE ALEATOIRE 15s */

function megaCelebration(){

const startTime=Date.now();

function randomFirework(){

launchFirework();

if(Date.now()-startTime<15000){

const delay=100+Math.random()*400;

setTimeout(randomFirework,delay);

}

}

randomFirework();

}

/* TEMPS REEL */

onValue(totalRef,snapshot=>{

const value=snapshot.val()||0;

animateCounter(previousValue,value);

/* BARRES */

const percent=Math.min(value/MAX_VALUE,1);

progressLeft.style.height=(percent*100)+"%";

progressRight.style.height=(100-percent*100)+"%";

/* COULEUR */

totalDiv.style.color=getPalierColor(value);

/* FLASH PALIERS */

const paliers=[1000,10000,100000,500000,1000000];

paliers.forEach(p=>{

if(previousValue<p && value>=p){

flashPalier(getPalierColor(p));

}

});

/* JACKPOT 1M */

if(value>=1000000 && previousValue<1000000){

megaCelebration();

}

previousValue=value;

});

/* RESET */

let leftClickCount=0;

document.body.addEventListener("click",e=>{

if(e.clientX<100 && e.clientY<100){

leftClickCount++;

if(leftClickCount>=5){

set(totalRef,0);

set(campingRef,null);

leftClickCount=0;

}

}else{

leftClickCount=0;

}

});

/* SOUSTRACTION */

let rightClickCount=0;

document.body.addEventListener("click",e=>{

const width=window.innerWidth;

if(e.clientX>width-100 && e.clientY<100){

rightClickCount++;

if(rightClickCount>=5){

rightClickCount=0;

get(totalRef).then(totalSnap=>{

const total=totalSnap.val()||0;

if(total<=0)return;

const percent=0.12+Math.random()*0.04;

const totalSubtract=Math.floor(total*percent);

const subtractPerCamping=Math.floor(totalSubtract/12);

get(campingRef).then(snapshot=>{

const campings=snapshot.val()||{};

const updates={};

let newTotal=0;

Object.keys(campings).forEach(key=>{

const value=campings[key]||0;

const newValue=Math.max(0,value-subtractPerCamping);

updates[key]=newValue;

newTotal+=newValue;

});

update(campingRef,updates);

set(totalRef,newTotal);

});

});

}

}else{

rightClickCount=0;

}

});

</script>

</body>
</html>
