<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte Globale</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Trebuchet MS",sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  overflow:hidden;
}

/* CONTENEUR PRINCIPAL */
.main-container{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100vh;
}

/* MONTANT */
#total{
  font-size:18vw;
  font-weight:900;
  color:#00ff55;
  line-height:1;
  transition:transform 0.3s ease,text-shadow 0.3s ease,color 0.5s ease;
  text-shadow:
    0 0 10px currentColor,
    0 0 25px currentColor,
    0 0 50px rgba(255,255,255,0.3);
}

.flash{
  transform:scale(1.05);
}

.palier-flash{
  animation:palierFlash 3s ease forwards;
}

@keyframes palierFlash{
  0% { text-shadow:0 0 10px currentColor; transform:scale(1); }
  50% { text-shadow:0 0 50px currentColor,0 0 100px currentColor; transform:scale(1.1); }
  100% { text-shadow:0 0 10px currentColor; transform:scale(1); }
}

/* BARRES */
.progress-bar{
  width:40px;
  height:70vh;
  background:#111;
  border-radius:20px;
  margin:0 50px;
  position:relative;
  overflow:hidden;
  box-shadow:
    inset 0 0 15px #000,
    0 0 20px rgba(0,255,85,0.25);
}

.progress-fill{
  position:absolute;
  bottom:0;
  width:100%;
  height:0%;
  background:linear-gradient(to top,#00ff55,#00ffaa);
  transition:height 0.6s ease;
}

.progress-bar.right .progress-fill{
  top:0;
  bottom:auto;
}

</style>
</head>

<body>

<div class="main-container">

  <div class="progress-bar left">
    <div id="progressLeft" class="progress-fill"></div>
  </div>

  <div id="total">0</div>

  <div class="progress-bar right">
    <div id="progressRight" class="progress-fill"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
  authDomain: "compteur-million-2.firebaseapp.com",
  databaseURL: "https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "compteur-million-2",
  storageBucket: "compteur-million-2.firebasedestorage.app",
  messagingSenderId: "226299332536",
  appId: "1:226299332536:web:4d79be3a4ed0b2ba50714d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db,"total_global");
const campingRef = ref(db,"camping");

const totalDiv = document.getElementById("total");
const progressLeft = document.getElementById("progressLeft");
const progressRight = document.getElementById("progressRight");

const MAX_VALUE=1000000;
let previousValue=0;

/* COMPTEUR ANIME */
function animateCounter(start,end,duration=800){
  const range=end-start;
  const startTime=performance.now();
  function updateCounter(currentTime){
    const elapsed=currentTime-startTime;
    const progress=Math.min(elapsed/duration,1);
    const value=Math.floor(start+range*progress);
    totalDiv.innerText=value.toLocaleString("fr-FR");
    if(progress<1) requestAnimationFrame(updateCounter);
  }
  requestAnimationFrame(updateCounter);
}

/* FLASH PALIER */
function flashPalier(color){
  totalDiv.style.color=color;
  totalDiv.classList.add("palier-flash");
  setTimeout(()=>totalDiv.classList.remove("palier-flash"),3000);
}

/* COULEUR SELON PALIER */
function getPalierColor(value){
  if(value>=1000000) return "#FFD700";
  if(value>=500000) return "#ff4444";
  if(value>=100000) return "#ff8800";
  if(value>=10000) return "#bb66ff";
  if(value>=1000) return "#9400D3"; // Violette
  return "#00ff55";
}

/* TEMPS REEL */
onValue(totalRef,snapshot=>{
  const value = snapshot.val()||0;
  animateCounter(previousValue,value);

  // BARRES PROGRESSION
  const percent = Math.min(value/MAX_VALUE,1);
  progressLeft.style.height = (percent*100)+"%";
  progressRight.style.height = ((1-percent)*100)+"%";

  // FLASH PALIER
  const palierValues = [1000,10000,100000,500000,1000000];
  palierValues.forEach(p=>{
    if(previousValue < p && value >= p){
      flashPalier(getPalierColor(p));
    }
  });

  // JACKPOT 1M
  if(value>=1000000 && previousValue<1000000){
    totalDiv.classList.add("jackpot");
    setTimeout(()=>totalDiv.classList.remove("jackpot"),5000);
  }

  // COULEUR
  totalDiv.style.color = getPalierColor(value);

  previousValue=value;
});

/* RESET 5 CLICS HAUT GAUCHE */
let leftClickCount=0;
document.body.addEventListener("click",e=>{
  if(e.clientX<100 && e.clientY<100){
    leftClickCount++;
    if(leftClickCount>=5){
      set(totalRef,0);
      set(campingRef,null);
      leftClickCount=0;
    }
  } else leftClickCount=0;
});

/* SOUSTRACTION ALEATOIRE */
let rightClickCount=0;
document.body.addEventListener("click",e=>{
  const width=window.innerWidth;
  if(e.clientX>width-100 && e.clientY<100){
    rightClickCount++;
    if(rightClickCount>=5){
      rightClickCount=0;
      get(totalRef).then(totalSnap=>{
        const total=totalSnap.val()||0;
        if(total<=0) return;
        const percent = 0.12 + Math.random()*0.04;
        const totalSubtract = Math.floor(total*percent);
        const subtractPerCamping = Math.floor(totalSubtract/12);
        get(campingRef).then(snapshot=>{
          const campings = snapshot.val()||{};
          const updates = {};
          let newTotal=0;
          Object.keys(campings).forEach(key=>{
            const value = campings[key]||0;
            const newValue = Math.max(0,value-subtractPerCamping);
            updates[key]=newValue;
            newTotal+=newValue;
          });
          update(campingRef,updates);
          set(totalRef,newTotal);
        });
      });
    }
  } else rightClickCount=0;
});

</script>
</body>
</html>
