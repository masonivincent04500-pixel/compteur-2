<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Camping</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Trebuchet MS",sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  transition:background .5s ease;
}

.container{
  background:white;
  padding:50px 60px;
  border-radius:20px;
  box-shadow:0 20px 45px rgba(0,0,0,.25);
  text-align:center;
  min-width:400px;
}

h1{
  margin-bottom:30px;
  font-size:30px;
  color:#333;
}

input{
  padding:12px 15px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
  width:220px;
  margin-right:10px;
}

button{
  padding:12px 22px;
  font-size:16px;
  border-radius:8px;
  border:none;
  background:#333;
  color:white;
  cursor:pointer;
}

#last{
  margin-top:20px;
  font-size:18px;
  color:#666;
}

#total_personnel{
  margin-top:25px;
  font-size:26px;
  font-weight:bold;
  color:#111;
}
</style>
</head>
<body>

<div class="container">
  <h1 id="titre"></h1>

  <input type="number" id="montant" placeholder="Ajouter un montant">
  <button onclick="ajouter()">Ajouter</button>

  <div id="last">Dernière valeur ajoutée : 0</div>
  <div id="total_personnel">Total de ce camping : 0</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
  authDomain: "compteur-million-2.firebaseapp.com",
  databaseURL: "https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "compteur-million-2",
  storageBucket: "compteur-million-2.firebasestorage.app",
  messagingSenderId: "226299332536",
  appId: "1:226299332536:web:4d79be3a4ed0b2ba50714d"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const params=new URLSearchParams(window.location.search);
const campingId=params.get("id");

const campingRef=ref(db,"camping/"+campingId);
const totalGlobalRef=ref(db,"total_global");

const totalDiv=document.getElementById("total_personnel");
const lastDiv=document.getElementById("last");
const titre=document.getElementById("titre");

titre.innerText="Cagnotte - "+campingId;

/* Sync camping */
onValue(campingRef,snapshot=>{
  totalDiv.innerText="Total de ce camping : "+(snapshot.val()||0);
});

/* Reset silencieux */
onValue(totalGlobalRef,snapshot=>{
  if((snapshot.val()||0)===0){
    runTransaction(campingRef,()=>0);
    lastDiv.innerText="Dernière valeur ajoutée : 0";
  }
});

/* Ajouter montant */
window.ajouter=function(){
  const valeur=parseInt(document.getElementById("montant").value);
  if(!isNaN(valeur)&&valeur>0){
    runTransaction(campingRef,current=>(current||0)+valeur);
    runTransaction(totalGlobalRef,current=>(current||0)+valeur);
    lastDiv.innerText="Dernière valeur ajoutée : "+valeur;
    document.getElementById("montant").value="";
  }
};
</script>

</body>
</html>
