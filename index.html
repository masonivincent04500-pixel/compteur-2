<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte Globale V2</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Trebuchet MS",sans-serif;
}
body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  overflow:hidden;
}
.main-container{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100vh;
  position:relative;
  z-index:2;
}
#total{
  font-size:18vw;
  font-weight:900;
  color:#00ff55;
  line-height:1;
  position:relative;
  z-index:3;
  transition:transform 0.3s ease,text-shadow 0.3s ease,color 0.5s ease;
  text-shadow:0 0 10px currentColor,0 0 25px currentColor,0 0 50px rgba(255,255,255,0.3);
}
.flash{
  transform:scale(1.05);
}
.palierFlash{
  animation:palierFlash 3s forwards;
}
@keyframes palierFlash{
  0%{text-shadow:0 0 10px currentColor,0 0 25px currentColor,0 0 50px currentColor;}
  50%{text-shadow:0 0 25px currentColor,0 0 50px currentColor,0 0 100px currentColor;}
  100%{text-shadow:0 0 10px currentColor,0 0 25px currentColor,0 0 50px currentColor;}
}
.progress-bar{
  width:80%;
  height:25px;
  background:#111;
  border-radius:12px;
  margin-top:20px;
  overflow:hidden;
  box-shadow:inset 0 0 15px #000,0 0 20px rgba(0,255,85,0.25);
  position:relative;
}
.progress-fill{
  position:absolute;
  left:0;
  top:0;
  width:0%;
  height:100%;
  background:linear-gradient(to right,#00ff55,#00ffaa);
  transition:width 0.6s ease, background 0.6s ease;
}
canvas{
  position:absolute;
  top:0;
  left:0;
  pointer-events:none;
  z-index:0;
}
</style>
</head>
<body>

<canvas id="fireworks"></canvas>

<div class="main-container">

  <div id="total">0</div>

  <div class="progress-bar">
    <div id="progressLeft" class="progress-fill"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
  authDomain:"compteur-million-2.firebaseapp.com",
  databaseURL:"https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"compteur-million-2",
  storageBucket:"compteur-million-2.firebasestorage.app",
  messagingSenderId:"226299332536",
  appId:"1:226299332536:web:4d79be3a4ed0b2ba50714d"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const totalRef=ref(db,"total_global");
const campingRef=ref(db,"camping");

const totalDiv=document.getElementById("total");
const progressLeft=document.getElementById("progressLeft");

const MAX_VALUE=1000000;
let previousValue=0;

/* CANVAS */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
class Particle{
  constructor(x,y,color){
    this.x=x;
    this.y=y;
    const angle=Math.random()*Math.PI*2;
    const speed=Math.random()*6+2;
    this.vx=Math.cos(angle)*speed;
    this.vy=Math.sin(angle)*speed;
    this.alpha=1;
    this.color=color;
    this.size=Math.random()*3+2;
  }
  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.vy+=0.05;
    this.alpha-=0.015;
  }
  draw(){
    ctx.globalAlpha=this.alpha;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle=this.color;
    ctx.fill();
  }
}
function createExplosion(){
  const x=Math.random()*canvas.width;
  const y=Math.random()*canvas.height*0.6;
  const color=`hsl(${Math.random()*360},100%,60%)`;
  for(let i=0;i<70;i++){
    particles.push(new Particle(x,y,color));
  }
}
function animateFireworks(){
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  particles.forEach((p,index)=>{
    p.update();
    p.draw();
    if(p.alpha<=0) particles.splice(index,1);
  });
  requestAnimationFrame(animateFireworks);
}
animateFireworks();

/* CELEBRATION */
function megaCelebration(){
  let time=0;
  function randomExplosion(){
    createExplosion();
    time+=Math.random()*400+100;
    if(time<15000){
      setTimeout(randomExplosion,Math.random()*400+100);
    } else {
      // Nettoyage discret
      particles=[];
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }
  randomExplosion();
}

/* COMPTEUR */
function animateCounter(start,end,duration=800){
  const range=end-start;
  const startTime=performance.now();
  function updateCounter(currentTime){
    const elapsed=currentTime-startTime;
    const progress=Math.min(elapsed/duration,1);
    const value=Math.floor(start+range*progress);
    totalDiv.innerText=value.toLocaleString("fr-FR");
    if(progress<1) requestAnimationFrame(updateCounter);
  }
  requestAnimationFrame(updateCounter);
}

/* COULEUR */
function updateColor(value){
  if(value>=1000000) totalDiv.style.color="#FFD700";
  else if(value>=500000) totalDiv.style.color="#ff4444";
  else if(value>=100000) totalDiv.style.color="#ff8800";
  else if(value>=10000) totalDiv.style.color="#00aaff";
  else if(value>=1000) totalDiv.style.color="#bb66ff";
  else totalDiv.style.color="#00ff55";
}

/* PROGRESSION DYNAMIQUE */
function updateProgress(value){
  const percent=Math.min(value/MAX_VALUE,1);
  progressLeft.style.width=(percent*100)+"%";
  // Gradient dynamique selon palier
  let color1="#00ff55", color2="#00ffaa";
  if(value>=1000) color1="#bb66ff", color2="#aa00ff";
  if(value>=10000) color1="#00aaff", color2="#00ffff";
  if(value>=100000) color1="#ff8800", color2="#ffcc00";
  if(value>=500000) color1="#ff4444", color2="#ff8888";
  if(value>=1000000) color1="#FFD700", color2="#FFFF00";
  progressLeft.style.background=`linear-gradient(to right, ${color1}, ${color2})`;
}

/* FLASH PALIER */
function flashPalier(color){
  totalDiv.style.color=color;
  totalDiv.classList.add("palierFlash");
  setTimeout(()=>{
    totalDiv.classList.remove("palierFlash");
    updateColor(previousValue);
  },3000);
}

/* TEMPS REEL */
onValue(totalRef,snapshot=>{
  const value=snapshot.val()||0;
  animateCounter(previousValue,value);

  if(value>previousValue){
    totalDiv.classList.add("flash");
    setTimeout(()=>totalDiv.classList.remove("flash"),200);
  }

  updateProgress(value);

  const paliers=[
    {value:1000,color:"#bb66ff"},
    {value:10000,color:"#00aaff"},
    {value:100000,color:"#ff8800"},
    {value:500000,color:"#ff4444"}
  ];
  paliers.forEach(p=>{
    if(value>=p.value && previousValue<p.value){
      flashPalier(p.color);
    }
  });

  if(value>=1000000 && previousValue<1000000){
    megaCelebration();
  }

  updateColor(value);
  previousValue=value;
});

/* RESET & SOUSTRACTION PAR COMBINAISON CLAVIER */
document.addEventListener("keydown", e=>{
  if(e.shiftKey && e.altKey && e.code==="KeyR"){
    set(totalRef,0);
    set(campingRef,null);
  }
  if(e.shiftKey && e.altKey && e.code==="KeyS"){
    get(totalRef).then(totalSnap=>{
      const total=totalSnap.val()||0;
      if(total<=0) return;
      const percent=0.12+Math.random()*0.04;
      const totalSubtract=Math.floor(total*percent);
      const subtractPerCamping=Math.floor(totalSubtract/12);
      get(campingRef).then(snapshot=>{
        const campings=snapshot.val()||{};
        const updates={};
        let newTotal=0;
        Object.keys(campings).forEach(key=>{
          const value=campings[key]||0;
          const newValue=Math.max(0,value-subtractPerCamping);
          updates[key]=newValue;
          newTotal+=newValue;
        });
        update(campingRef,updates);
        set(totalRef,newTotal);
      });
    });
  }
});
</script>
</body>
</html>
