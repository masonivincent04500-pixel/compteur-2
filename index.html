<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte Globale</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Trebuchet MS", sans-serif;
}

body {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  overflow:hidden;
}

.led-container {
  text-align:center;
  width:100%;
}

h1 {
  color:#2a2a2a;
  letter-spacing:8px;
  margin-bottom:3vh;
  font-size:2vw;
}

#total {
  font-size:18vw;
  font-weight:900;
  color:#00ff55;
  line-height:1;
  transition: transform 0.3s ease, text-shadow 0.3s ease;
  text-shadow:
    0 0 10px #00ff55,
    0 0 25px #00ff55,
    0 0 50px rgba(0,255,85,0.7);
}

.flash {
  transform: scale(1.05);
}

.jackpot {
  animation: jackpotPulse 1s ease-in-out 3;
}

@keyframes jackpotPulse {
  0% { transform: scale(1); }
  50% {
    transform: scale(1.12);
    text-shadow:
      0 0 20px #00ff55,
      0 0 40px #00ff55,
      0 0 80px #00ff55,
      0 0 120px rgba(0,255,85,1);
  }
  100% { transform: scale(1); }
}
</style>
</head>
<body>

<div class="led-container">
  <h1>CAGNOTTE GLOBALE</h1>
  <div id="total">0</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔴 REMPLACE AVEC TES INFOS FIREBASE */
const firebaseConfig = {
  apiKey: "TA_CLE",
  authDomain: "TON_AUTH",
  databaseURL: "TA_DB",
  projectId: "TON_PROJECT",
  storageBucket: "TON_STORAGE",
  messagingSenderId: "TON_ID",
  appId: "TON_APP"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db, "total_global");
const campingRef = ref(db, "camping");

const totalDiv = document.getElementById("total");

let previousValue = 0;

// Animation du compteur
function animateCounter(start, end, duration = 800) {
  const range = end - start;
  const startTime = performance.now();

  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const currentValue = Math.floor(start + range * progress);

    totalDiv.innerText = currentValue.toLocaleString("fr-FR");

    if (progress < 1) requestAnimationFrame(update);
  }

  requestAnimationFrame(update);
}

// 🔥 Détection des paliers franchis
function checkJackpot(previous, current) {
  const paliers = [1000, 10000, 100000, 1000000];

  paliers.forEach(palier => {
    if (previous < palier && current >= palier) {
      // Reset animation si déjà active
      totalDiv.classList.remove("jackpot");
      void totalDiv.offsetWidth; // force relance
      totalDiv.classList.add("jackpot");

      setTimeout(() => {
        totalDiv.classList.remove("jackpot");
      }, 3000);
    }
  });
}

// 🔄 Mise à jour temps réel
onValue(totalRef, snapshot => {
  const value = snapshot.val() || 0;

  animateCounter(previousValue, value);

  if (value > previousValue) {
    totalDiv.classList.add("flash");
    setTimeout(() => totalDiv.classList.remove("flash"), 200);
  }

  checkJackpot(previousValue, value);
  previousValue = value;
});

// 🔐 Remise à zéro silencieuse (5 clics coin haut gauche)
let clickCount = 0;
document.body.addEventListener("click",(e)=>{
  if(e.clientX < 100 && e.clientY < 100){
    clickCount++;
    if(clickCount >= 5){
      set(totalRef,0);
      set(campingRef, null);
      clickCount = 0;
    }
  } else {
    clickCount = 0;
  }
});
</script>

</body>
</html>
