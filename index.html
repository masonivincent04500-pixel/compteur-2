<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte Globale</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Trebuchet MS", sans-serif;
}

body {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg, #1f2937, #111827);
  color:white;
}

.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  padding: 60px 100px;
  border-radius: 25px;
  text-align:center;
  box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.15);
  position: relative;
}

h1 {
  font-size: 32px;
  letter-spacing: 2px;
  margin-bottom: 30px;
  opacity: 0.8;
}

#total {
  font-size: 90px;
  font-weight: bold;
  letter-spacing: 3px;
  transition: transform 0.2s ease;
}

.grow {
  transform: scale(1.1);
}

.subtitle {
  margin-top: 20px;
  font-size: 18px;
  opacity: 0.6;
}

/* Bouton reset discret */
.reset-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(255,255,255,0.15);
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  font-size: 14px;
  opacity: 0.6;
  transition: opacity 0.2s ease, background 0.2s ease;
}

.reset-btn:hover {
  opacity: 1;
  background: rgba(255,255,255,0.25);
}
</style>
</head>
<body>

<div class="card">
  <button class="reset-btn" onclick="resetTotal()">Remise à 0</button>

  <h1>CAGNOTTE GLOBALE</h1>
  <div id="total">0</div>
  <div class="subtitle">Objectif : 1 000 000</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
  authDomain: "compteur-million-2.firebaseapp.com",
  databaseURL: "https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "compteur-million-2",
  storageBucket: "compteur-million-2.firebasestorage.app",
  messagingSenderId: "226299332536",
  appId: "1:226299332536:web:4d79be3a4ed0b2ba50714d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db, "total_global");
const campingRef = ref(db, "camping");

const totalDiv = document.getElementById("total");

let previousValue = 0;

onValue(totalRef, snapshot => {
  const value = snapshot.val() || 0;

  totalDiv.innerText = value.toLocaleString("fr-FR");

  if (value > previousValue) {
    totalDiv.classList.add("grow");
    setTimeout(() => {
      totalDiv.classList.remove("grow");
    }, 200);
  }

  previousValue = value;
});

// 🔥 RESET GLOBAL + tous les campings
window.resetTotal = function() {
  set(totalRef, 0);
  set(campingRef, null); // remet tous les campings à zéro
};
</script>

</body>
</html>
