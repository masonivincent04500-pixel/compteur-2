<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte Globale</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Trebuchet MS",sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
overflow:hidden;
}

.container{
display:flex;
align-items:center;
justify-content:center;
gap:80px;
width:100%;
}

.progress-bar{
width:40px;
height:70vh;
border:2px solid rgba(255,255,255,0.2);
border-radius:20px;
position:relative;
overflow:hidden;
}

.progress-fill{
position:absolute;
left:0;
width:100%;
transition:height 0.5s;
}

.left .progress-fill{
bottom:0;
height:0%;
}

.right .progress-fill{
top:0;
height:100%;
}

.led-container{
text-align:center;
}

#total{
font-size:16vw;
font-weight:900;
color:#00ff55;
text-shadow:
0 0 10px currentColor,
0 0 30px currentColor,
0 0 60px rgba(255,255,255,0.3);
transition:all 0.4s;
}

.flash{
transform:scale(1.05);
}

</style>
</head>

<body>

<div class="container">

<div class="progress-bar left">
<div class="progress-fill" id="progressLeft"></div>
</div>

<div class="led-container">
<div id="total">0</div>
</div>

<div class="progress-bar right">
<div class="progress-fill" id="progressRight"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
authDomain:"compteur-million-2.firebaseapp.com",
databaseURL:"https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
projectId:"compteur-million-2",
storageBucket:"compteur-million-2.firebasestorage.app",
messagingSenderId:"226299332536",
appId:"1:226299332536:web:4d79be3a4ed0b2ba50714d"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const totalRef=ref(db,"total_global");
const campingRef=ref(db,"camping");

const totalDiv=document.getElementById("total");
const progressLeft=document.getElementById("progressLeft");
const progressRight=document.getElementById("progressRight");

let previousValue=0;
const MAX=1000000;

function getColor(value){

if(value>=1000000) return "#FFD700";
if(value>=500000) return "#ff3b3b";
if(value>=100000) return "#00d0ff";
if(value>=10000) return "#ff8c00";
if(value>=1000) return "#00ff55";

return "#00ff55";

}

function animateCounter(start,end,duration=800){

const range=end-start;
const startTime=performance.now();

function update(currentTime){

const elapsed=currentTime-startTime;
const progress=Math.min(elapsed/duration,1);

const value=Math.floor(start+range*progress);

totalDiv.innerText=value.toLocaleString("fr-FR");

if(progress<1) requestAnimationFrame(update);

}

requestAnimationFrame(update);

}

function updateProgress(value){

const percent=Math.min(value/MAX,1);

progressLeft.style.height=(percent*100)+"%";

const rightHeight=(1-percent)*100;

progressRight.style.height=rightHeight+"%";

}

function updateColor(value){

const color=getColor(value);

totalDiv.style.color=color;
progressLeft.style.background=color;
progressRight.style.background=color;

}

function launchFirework(){

const canvas=document.createElement("canvas");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

canvas.style.position="absolute";
canvas.style.top="0";
canvas.style.left="0";
canvas.style.pointerEvents="none";

document.body.appendChild(canvas);

const ctx=canvas.getContext("2d");

const x=Math.random()*canvas.width;
const y=Math.random()*canvas.height*0.6;

const particles=[];

for(let i=0;i<80;i++){

particles.push({
x:x,
y:y,
dx:(Math.random()-0.5)*8,
dy:(Math.random()-0.5)*8,
life:60,
color:`hsl(${Math.random()*360},100%,50%)`
});

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{

p.x+=p.dx;
p.y+=p.dy;
p.life--;

ctx.beginPath();
ctx.arc(p.x,p.y,3,0,Math.PI*2);
ctx.fillStyle=p.color;
ctx.fill();

});

if(particles.some(p=>p.life>0)){

requestAnimationFrame(animate);

}else{

canvas.remove();

}

}

animate();

}

function megaCelebration(){

const start=Date.now();

function loop(){

launchFirework();

if(Date.now()-start<15000){

const delay=100+Math.random()*400;

setTimeout(loop,delay);

}

}

loop();

}

onValue(totalRef,snapshot=>{

const value=snapshot.val()||0;

animateCounter(previousValue,value);

updateProgress(value);

updateColor(value);

if(value>previousValue){

totalDiv.classList.add("flash");

setTimeout(()=>totalDiv.classList.remove("flash"),200);

}

if(value>=1000000 && previousValue<1000000){

megaCelebration();

}

previousValue=value;

});

let leftClickCount=0;

document.body.addEventListener("click",(e)=>{

if(e.clientX<100 && e.clientY<100){

leftClickCount++;

if(leftClickCount>=5){

set(totalRef,0);
set(campingRef,null);

leftClickCount=0;

}

}else{

leftClickCount=0;

}

});

let rightClickCount=0;

document.body.addEventListener("click",(e)=>{

const width=window.innerWidth;

if(e.clientX>width-100 && e.clientY<100){

rightClickCount++;

if(rightClickCount>=5){

rightClickCount=0;

get(totalRef).then(totalSnap=>{

const total=totalSnap.val()||0;

if(total<=0) return;

const percent=0.12+Math.random()*0.04;

const totalSubtract=Math.floor(total*percent);

const subtractPerCamping=Math.floor(totalSubtract/12);

get(campingRef).then(snapshot=>{

const campings=snapshot.val()||{};

const updates={};

let newTotal=0;

Object.keys(campings).forEach(key=>{

const value=campings[key]||0;

const newValue=Math.max(0,value-subtractPerCamping);

updates[key]=newValue;

newTotal+=newValue;

});

update(campingRef,updates);

set(totalRef,newTotal);

});

});

}

}else{

rightClickCount=0;

}

});

</script>

</body>
</html>
