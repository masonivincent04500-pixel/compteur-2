<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte Globale</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Trebuchet MS", sans-serif;
}

body {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:black;
  overflow:hidden;
}

/* Effet écran LED */
.led-container {
  text-align:center;
}

h1 {
  color:#444;
  letter-spacing:4px;
  margin-bottom:40px;
  font-size:28px;
}

/* Chiffre LED */
#total {
  font-size:180px;
  font-weight:bold;
  color:#00ff55;
  text-shadow:
    0 0 5px #00ff55,
    0 0 10px #00ff55,
    0 0 20px #00ff55,
    0 0 40px #00ff55;
  transition: transform 0.2s ease;
}

/* Petit effet quand ça augmente */
.flash {
  transform: scale(1.08);
}
</style>
</head>
<body>

<div class="led-container">
  <h1>CAGNOTTE GLOBALE</h1>
  <div id="total">0</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔴 CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
  authDomain: "compteur-million-2.firebaseapp.com",
  databaseURL: "https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "compteur-million-2",
  storageBucket: "compteur-million-2.firebasestorage.app",
  messagingSenderId: "226299332536",
  appId: "1:226299332536:web:4d79be3a4ed0b2ba50714d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db, "total_global");
const campingRef = ref(db, "camping");

const totalDiv = document.getElementById("total");
let previousValue = 0;

// 🔥 Mise à jour temps réel
onValue(totalRef, snapshot => {
  const value = snapshot.val() || 0;
  totalDiv.innerText = value.toLocaleString("fr-FR");

  if (value > previousValue) {
    totalDiv.classList.add("flash");
    setTimeout(() => totalDiv.classList.remove("flash"), 200);
  }

  previousValue = value;
});

// 🔐 Reset invisible : 5 clics coin haut gauche
let clickCount = 0;
const secretZone = { x:0, y:0, width:100, height:100 }; // coin en haut à gauche

document.body.addEventListener("click", (e) => {
  if(e.clientX <= secretZone.width && e.clientY <= secretZone.height){
    clickCount++;
    if(clickCount >= 5){
      // Reset total global + tous les campings
      set(totalRef, 0);
      set(campingRef, null);
      clickCount = 0; // réinitialise le compteur
    }
  } else {
    clickCount = 0; // clic hors coin = réinitialisation
  }
});
</script>

</body>
</html>
