<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte Globale</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Trebuchet MS", sans-serif;
}

body {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:black;
  overflow:hidden;
}

/* Effet écran LED */
.led-container {
  text-align:center;
}

h1 {
  color:#444;
  letter-spacing:4px;
  margin-bottom:40px;
  font-size:28px;
}

/* Chiffre LED */
#total {
  font-size:120px;
  font-weight:bold;
  color:#00ff55;
  text-shadow:
    0 0 5px #00ff55,
    0 0 10px #00ff55,
    0 0 20px #00ff55,
    0 0 40px #00ff55;
  transition: transform 0.2s ease;
}

/* Petit effet quand ça augmente */
.flash {
  transform: scale(1.08);
}

/* Bouton admin caché */
#adminPanel {
  position:fixed;
  bottom:20px;
  right:20px;
  display:none;
}

#adminPanel button {
  background:#222;
  color:white;
  border:1px solid #555;
  padding:8px 15px;
  border-radius:6px;
  cursor:pointer;
  opacity:0.7;
}

#adminPanel button:hover {
  opacity:1;
}
</style>
</head>
<body>

<div class="led-container">
  <h1>CAGNOTTE GLOBALE</h1>
  <div id="total">0</div>
</div>

<!-- Panel admin caché -->
<div id="adminPanel">
  <button onclick="resetTotal()">Remise à 0</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
  authDomain: "compteur-million-2.firebaseapp.com",
  databaseURL: "https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "compteur-million-2",
  storageBucket: "compteur-million-2.firebasestorage.app",
  messagingSenderId: "226299332536",
  appId: "1:226299332536:web:4d79be3a4ed0b2ba50714d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db, "total_global");
const campingRef = ref(db, "camping");

const totalDiv = document.getElementById("total");
const adminPanel = document.getElementById("adminPanel");

let previousValue = 0;

// Mise à jour temps réel
onValue(totalRef, snapshot => {
  const value = snapshot.val() || 0;
  totalDiv.innerText = value.toLocaleString("fr-FR");

  if (value > previousValue) {
    totalDiv.classList.add("flash");
    setTimeout(() => totalDiv.classList.remove("flash"), 200);
  }

  previousValue = value;
});

// Reset global + tous les campings
window.resetTotal = function() {
  set(totalRef, 0);
  set(campingRef, null);
};

// 🔒 Double clic pour afficher le mode admin
document.addEventListener("dblclick", () => {
  adminPanel.style.display =
    adminPanel.style.display === "none" ? "block" : "none";
});
</script>

</body>
</html>
