<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte Globale</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Trebuchet MS", sans-serif;
}

body {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  overflow:hidden;
  position:relative;
}

#total {
  font-size:18vw;
  font-weight:900;
  color:#00ff55;
  line-height:1;
  transition: transform 0.3s ease, text-shadow 0.3s ease;
  text-shadow:
    0 0 10px #00ff55,
    0 0 25px #00ff55,
    0 0 50px rgba(0,255,85,0.7);
  text-align:center;
}

.flash {
  transform: scale(1.05);
}

.jackpot {
  animation: jackpotPulse 1s ease-in-out 3;
}

@keyframes jackpotPulse {
  0% { transform: scale(1); }
  50% { 
    transform: scale(1.12);
    text-shadow:
      0 0 20px #00ff55,
      0 0 40px #00ff55,
      0 0 80px #00ff55,
      0 0 120px rgba(0,255,85,1);
  }
  100% { transform: scale(1); }
}

/* Confettis */
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background-color: red;
  opacity: 0.9;
  pointer-events: none;
  z-index: 1000;
  border-radius: 50%;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}
</style>
</head>
<body>

<div id="total">0</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// 🔑 Configuration Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
  authDomain: "compteur-million-2.firebaseapp.com",
  databaseURL: "https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "compteur-million-2",
  storageBucket: "compteur-million-2.firebasestorage.app",
  messagingSenderId: "226299332536",
  appId: "1:226299332536:web:4d79be3a4ed0b2ba50714d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db, "total_global");
const campingRef = ref(db, "camping");
const totalDiv = document.getElementById("total");

let previousValue = 0;

// Animation compteur fluide
function animateCounter(start, end, duration = 800) {
  const range = end - start;
  const startTime = performance.now();

  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const currentValue = Math.floor(start + range * progress);
    totalDiv.innerText = currentValue.toLocaleString("fr-FR");
    if(progress < 1) requestAnimationFrame(update);
  }

  requestAnimationFrame(update);
}

// Confettis
function spawnConfetti() {
  for(let i=0;i<150;i++){
    const confetti = document.createElement('div');
    confetti.className='confetti';
    confetti.style.left = Math.random()*window.innerWidth + 'px';
    confetti.style.backgroundColor = `hsl(${Math.random()*360},100%,50%)`;
    document.body.appendChild(confetti);
    setTimeout(()=>document.body.removeChild(confetti),3000);
  }
}

// Feux d’artifice
function fireworksOnce() {
  const canvas = document.createElement('canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.position='absolute';
  canvas.style.top='0';
  canvas.style.left='0';
  canvas.style.zIndex='999';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  const particles = [];
  for(let i=0;i<50;i++){
    particles.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height/2,
      dx:(Math.random()-0.5)*5,
      dy:(Math.random()-1.5)*5,
      radius:Math.random()*3+2,
      color:`hsl(${Math.random()*360},100%,50%)`
    });
  }

  let t=0;
  function animate(){
    t++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x+=p.dx; p.y+=p.dy;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.radius,0,2*Math.PI);
      ctx.fillStyle=p.color;
      ctx.fill();
    });
    if(t<60) requestAnimationFrame(animate);
    else document.body.removeChild(canvas);
  }
  animate();
}

// 🔔 Explosion toutes les secondes pendant 15s
function celebration() {
  let count = 0;
  const interval = setInterval(()=>{
    spawnConfetti();
    fireworksOnce();
    count++;
    if(count>=15) clearInterval(interval);
  },1000);
}

// Mise à jour temps réel
onValue(totalRef, snapshot=>{
  const value = snapshot.val()||0;
  animateCounter(previousValue,value);

  if(value>previousValue){
    totalDiv.classList.add("flash");
    setTimeout(()=>totalDiv.classList.remove("flash"),200);
  }

  if(value>=1000000 && previousValue<1000000){
    totalDiv.classList.add("jackpot");
    celebration();
    setTimeout(()=>totalDiv.classList.remove("jackpot"),15000);
  }

  previousValue = value;
});

// 🔴 Remise à 0 : 5 clics coin haut gauche
let leftClickCount=0;
document.body.addEventListener("click",(e)=>{
  if(e.clientX<100 && e.clientY<100){
    leftClickCount++;
    if(leftClickCount>=5){
      set(totalRef,0);
      set(campingRef,null);
      leftClickCount=0;
    }
  } else leftClickCount=0;
});

// ⚡ Soustraction aléatoire 12-16% : 5 clics coin haut droit
let rightClickCount=0;
document.body.addEventListener("click",(e)=>{
  const width=window.innerWidth;
  if(e.clientX>width-100 && e.clientY<100){
    rightClickCount++;
    if(rightClickCount>=5){
      rightClickCount=0;
      get(totalRef).then(totalSnap=>{
        const total = totalSnap.val()||0;
        if(total<=0) return;
        const percent = 0.12 + Math.random()*0.04;
        const totalSubtract = Math.floor(total*percent);
        const subtractPerCamping = Math.floor(totalSubtract/12);

        get(campingRef).then(snapshot=>{
          const campings = snapshot.val()||{};
          const updates = {};
          let newTotal=0;
          Object.keys(campings).forEach(key=>{
            const value=campings[key]||0;
            const newValue=Math.max(0,value-subtractPerCamping);
            updates[key]=newValue;
            newTotal+=newValue;
          });
          update(campingRef,updates);
          set(totalRef,newTotal);
        });
      });
    }
  } else rightClickCount=0;
});
</script>

</body>
</html>
