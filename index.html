<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte Globale</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Trebuchet MS", sans-serif;
}

body {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  overflow:hidden;
}

/* Conteneur principal */
.led-container {
  text-align:center;
  width:100%;
}

/* Titre discret */
h1 {
  color:#333;
  letter-spacing:6px;
  margin-bottom:3vh;
  font-size:2vw;
}

/* Chiffre LED optimisé écran géant */
#total {
  font-size:18vw; /* adaptatif selon largeur écran */
  font-weight:900;
  color:#00ff55;
  line-height:1;
  text-shadow:
    0 0 8px #00ff55,
    0 0 18px #00ff55,
    0 0 35px rgba(0,255,85,0.6);
  transition: transform 0.2s ease, text-shadow 0.2s ease;
}

/* Effet quand ça augmente */
.flash {
  transform: scale(1.05);
  text-shadow:
    0 0 12px #00ff55,
    0 0 25px #00ff55,
    0 0 50px rgba(0,255,85,0.8);
}
</style>
</head>
<body>

<div class="led-container">
  <h1>CAGNOTTE GLOBALE</h1>
  <div id="total">0</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
  authDomain: "compteur-million-2.firebaseapp.com",
  databaseURL: "https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "compteur-million-2",
  storageBucket: "compteur-million-2.firebasestorage.app",
  messagingSenderId: "226299332536",
  appId: "1:226299332536:web:4d79be3a4ed0b2ba50714d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db, "total_global");
const campingRef = ref(db, "camping");

const totalDiv = document.getElementById("total");

let previousValue = 0;

// Mise à jour temps réel
onValue(totalRef, snapshot => {
  const value = snapshot.val() || 0;
  totalDiv.innerText = value.toLocaleString("fr-FR");

  if (value > previousValue) {
    totalDiv.classList.add("flash");
    setTimeout(() => totalDiv.classList.remove("flash"), 200);
  }

  previousValue = value;
});

// Remise à zéro discrète : 5 clics coin haut gauche
let clickCount = 0;
document.body.addEventListener("click",(e)=>{
  if(e.clientX < 100 && e.clientY < 100){
    clickCount++;
    if(clickCount >= 5){
      set(totalRef,0);
      set(campingRef, null);
      clickCount = 0;
    }
  } else {
    clickCount = 0;
  }
});
</script>

</body>
</html>
