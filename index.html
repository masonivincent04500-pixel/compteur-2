<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte Globale</title>
<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Trebuchet MS", sans-serif;
}
body {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  overflow:hidden;
  position:relative;
}
#total {
  font-size:18vw;
  font-weight:900;
  color:#00ff55;
  line-height:1;
  transition: transform 0.3s ease, text-shadow 0.3s ease;
  text-shadow:
    0 0 10px #00ff55,
    0 0 25px #00ff55,
    0 0 50px rgba(0,255,85,0.7);
}
.flash { transform: scale(1.05); }
.jackpot { animation: jackpotPulse 1s ease-in-out 3; }
@keyframes jackpotPulse {
  0% { transform: scale(1); }
  50% { 
    transform: scale(1.12);
    text-shadow:
      0 0 20px #00ff55,
      0 0 40px #00ff55,
      0 0 80px #00ff55,
      0 0 120px rgba(0,255,85,1);
  }
  100% { transform: scale(1); }
}
/* Confettis */
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  opacity: 0.9;
  pointer-events: none;
  border-radius: 50%;
  z-index: 1000;
}
</style>
</head>
<body>

<div id="total">0</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
  authDomain: "compteur-million-2.firebaseapp.com",
  databaseURL: "https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "compteur-million-2",
  storageBucket: "compteur-million-2.firebasestorage.app",
  messagingSenderId: "226299332536",
  appId: "1:226299332536:web:4d79be3a4ed0b2ba50714d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const totalRef = ref(db, "total_global");
const campingRef = ref(db, "camping");
const totalDiv = document.getElementById("total");

let previousValue = 0;

// Animation compteur fluide
function animateCounter(start, end, duration = 800) {
  const range = end - start;
  const startTime = performance.now();
  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const currentValue = Math.floor(start + range * progress);
    totalDiv.innerText = currentValue.toLocaleString("fr-FR");
    if(progress < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

// Confettis explosifs
function spawnConfettiCenter() {
  const confettis=[];
  for(let i=0;i<100;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=(window.innerWidth/2)+'px';
    c.style.top=(window.innerHeight/2)+'px';
    c.style.backgroundColor=`hsl(${Math.random()*360},100%,50%)`;
    document.body.appendChild(c);
    confettis.push({el:c, angle:Math.random()*2*Math.PI, speed:Math.random()*10+5});
  }

  let t=0;
  const interval = setInterval(()=>{
    t++;
    confettis.forEach(c=>{
      const dx=Math.cos(c.angle)*c.speed;
      const dy=Math.sin(c.angle)*c.speed;
      const left=parseFloat(c.el.style.left)+dx;
      const top=parseFloat(c.el.style.top)+dy;
      c.el.style.left=left+'px';
      c.el.style.top=top+'px';
      c.el.style.opacity=(1-t/60).toString();
    });
    if(t>=60){
      confettis.forEach(c=>document.body.removeChild(c.el));
      clearInterval(interval);
    }
  },250);
}

// Feux d’artifice simples
function fireworks(duration=15000){
  const canvas=document.createElement('canvas');
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  canvas.style.position='absolute';
  canvas.style.top='0';
  canvas.style.left='0';
  canvas.style.zIndex='999';
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d');

  const particles=[];
  for(let i=0;i<50;i++){
    particles.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height/2,
      dx:(Math.random()-0.5)*5, dy:(Math.random()-1.5)*5,
      radius:Math.random()*3+2, color:`hsl(${Math.random()*360},100%,50%)`});
  }

  let t=0;
  const interval=setInterval(()=>{
    t++;
    ctx.fillStyle='rgba(0,0,0,0.1)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x+=p.dx; p.y+=p.dy;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.radius,0,2*Math.PI);
      ctx.fillStyle=p.color;
      ctx.fill();
    });
    if(t>duration/1000) {
      clearInterval(interval);
      document.body.removeChild(canvas);
    }
  },1000/30); // ~30fps
}

// Mise à jour temps réel
onValue(totalRef, snapshot=>{
  const value = snapshot.val()||0;
  animateCounter(previousValue,value);

  if(value>previousValue){
    totalDiv.classList.add("flash");
    setTimeout(()=>totalDiv.classList.remove("flash"),200);
  }

  // Jackpot 1 million
  if(value>=1000000 && previousValue<1000000){
    totalDiv.classList.add("jackpot");
    const startTime = Date.now();
    const duration = 15000;
    const confettiTimer = setInterval(spawnConfettiCenter, 1000); // toutes les secondes
    fireworks(duration);
    const stop = setInterval(()=>{
      if(Date.now()-startTime>=duration){
        clearInterval(confettiTimer);
        totalDiv.classList.remove("jackpot");
        clearInterval(stop);
      }
    },500);
  }

  previousValue=value;
});

// 🔴 Remise à 0 : 5 clics coin haut gauche
let leftClickCount=0;
document.body.addEventListener("click",(e)=>{
  if(e.clientX<100 && e.clientY<100){
    leftClickCount++;
    if(leftClickCount>=5){
      set(totalRef,0);
      set(campingRef,null);
      leftClickCount=0;
    }
  } else leftClickCount=0;
});

// ⚡ Soustraction aléatoire 12-16% : 5 clics coin haut droit
let rightClickCount=0;
document.body.addEventListener("click",(e)=>{
  const width=window.innerWidth;
  if(e.clientX>width-100 && e.clientY<100){
    rightClickCount++;
    if(rightClickCount>=5){
      rightClickCount=0;
      get(totalRef).then(totalSnap=>{
        const total=totalSnap.val()||0;
        if(total<=0) return;
        const percent=0.12+Math.random()*0.04;
        const totalSubtract=Math.floor(total*percent);
        const subtractPerCamping=Math.floor(totalSubtract/12);

        get(campingRef).then(snapshot=>{
          const campings=snapshot.val()||{};
          const updates={};
          let newTotal=0;
          Object.keys(campings).forEach(key=>{
            const value=campings[key]||0;
            const newValue=Math.max(0,value-subtractPerCamping);
            updates[key]=newValue;
            newTotal+=newValue;
          });
          update(campingRef,updates);
          set(totalRef,newTotal);
        });
      });
    }
  } else rightClickCount=0;
});
</script>

</body>
</html>
