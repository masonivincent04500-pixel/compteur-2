<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Trebuchet MS", sans-serif;
}

body {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  overflow:hidden;
}

#total {
  font-size:18vw;
  font-weight:900;
  color:#00ff55;
  line-height:1;
  transition: transform 0.3s ease, text-shadow 0.3s ease;
  text-shadow:
    0 0 10px #00ff55,
    0 0 25px #00ff55,
    0 0 50px rgba(0,255,85,0.7);
}

.flash {
  transform: scale(1.05);
}

.jackpot {
  animation: jackpotPulse 1s ease-in-out 3;
}

@keyframes jackpotPulse {
  0% { transform: scale(1); }
  50% {
    transform: scale(1.12);
    text-shadow:
      0 0 20px #00ff55,
      0 0 40px #00ff55,
      0 0 80px #00ff55,
      0 0 120px rgba(0,255,85,1);
  }
  100% { transform: scale(1); }
}
</style>
</head>
<body>

<div id="total">0</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
  authDomain: "compteur-million-2.firebaseapp.com",
  databaseURL: "https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "compteur-million-2",
  storageBucket: "compteur-million-2.firebasestorage.app",
  messagingSenderId: "226299332536",
  appId: "1:226299332536:web:4d79be3a4ed0b2ba50714d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db, "total_global");
const campingRef = ref(db, "camping");

const totalDiv = document.getElementById("total");

let previousValue = 0;

/* Animation compteur fluide */
function animateCounter(start, end, duration = 800) {
  const range = end - start;
  const startTime = performance.now();

  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const currentValue = Math.floor(start + range * progress);
    totalDiv.innerText = currentValue.toLocaleString("fr-FR");
    if (progress < 1) requestAnimationFrame(update);
  }

  requestAnimationFrame(update);
}

/* Paliers */
function checkJackpot(value) {
  const paliers = [1000, 10000, 100000, 1000000];
  if (paliers.includes(value)) {
    totalDiv.classList.add("jackpot");
    setTimeout(() => totalDiv.classList.remove("jackpot"), 3000);
  }
}

/* Sync temps réel */
onValue(totalRef, snapshot => {
  const value = snapshot.val() || 0;

  animateCounter(previousValue, value);

  if (value !== previousValue) {
    totalDiv.classList.add("flash");
    setTimeout(() => totalDiv.classList.remove("flash"), 200);
  }

  checkJackpot(value);
  previousValue = value;
});

/* RESET discret coin haut gauche */
let clickLeft = 0;
document.body.addEventListener("click",(e)=>{
  if(e.clientX < 100 && e.clientY < 100){
    clickLeft++;
    if(clickLeft >= 5){
      set(totalRef,0);
      set(campingRef,null);
      clickLeft = 0;
    }
  } else clickLeft = 0;
});

/* 🎲 Soustraction magique 12% → 16% */
let clickRight = 0;
document.body.addEventListener("click",(e)=>{
  const width = window.innerWidth;

  if(e.clientX > width - 100 && e.clientY < 100){
    clickRight++;

    if(clickRight >= 5){

      runTransaction(totalRef, current => {
        const total = current || 0;

        const randomPercent = 0.12 + Math.random() * (0.16 - 0.12);
        const amountToSubtract = Math.floor(total * randomPercent);

        const newValue = total - amountToSubtract;
        return newValue < 0 ? 0 : newValue;
      });

      clickRight = 0;
    }

  } else clickRight = 0;
});
</script>

</body>
</html>
