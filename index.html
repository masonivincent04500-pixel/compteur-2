<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cagnotte</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Trebuchet MS",sans-serif;
}

body {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  overflow:hidden;
}

#total {
  font-size:18vw;
  font-weight:900;
  color:#00ff55;
  line-height:1;
  transition:transform .3s ease, text-shadow .3s ease;
  text-shadow:
    0 0 10px #00ff55,
    0 0 25px #00ff55,
    0 0 50px rgba(0,255,85,.7);
}

.flash { transform:scale(1.05); }
</style>
</head>
<body>

<div id="total">0</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, runTransaction, get, update } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBnTkiUSRgVlD0sLTuV0YV92LWkPWBQAbA",
  authDomain: "compteur-million-2.firebaseapp.com",
  databaseURL: "https://compteur-million-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "compteur-million-2",
  storageBucket: "compteur-million-2.firebasestorage.app",
  messagingSenderId: "226299332536",
  appId: "1:226299332536:web:4d79be3a4ed0b2ba50714d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db,"total_global");
const campingRef = ref(db,"camping");

const totalDiv = document.getElementById("total");

let previousValue = 0;

/* Animation compteur */
function animateCounter(start,end,duration=800){
  const range=end-start;
  const startTime=performance.now();
  function updateFrame(currentTime){
    const progress=Math.min((currentTime-startTime)/duration,1);
    const value=Math.floor(start+range*progress);
    totalDiv.innerText=value.toLocaleString("fr-FR");
    if(progress<1) requestAnimationFrame(updateFrame);
  }
  requestAnimationFrame(updateFrame);
}

/* Sync temps réel */
onValue(totalRef,snapshot=>{
  const value=snapshot.val()||0;
  animateCounter(previousValue,value);
  if(value!==previousValue){
    totalDiv.classList.add("flash");
    setTimeout(()=>totalDiv.classList.remove("flash"),200);
  }
  previousValue=value;
});

/* RESET discret (coin haut gauche) */
let leftClick=0;
document.body.addEventListener("click",(e)=>{
  if(e.clientX<100 && e.clientY<100){
    leftClick++;
    if(leftClick>=5){
      set(totalRef,0);
      set(campingRef,null);
      leftClick=0;
    }
  } else leftClick=0;
});

/* 🎲 Soustraction proportionnelle équitable */
let rightClick=0;
document.body.addEventListener("click",async(e)=>{
  const width=window.innerWidth;

  if(e.clientX>width-100 && e.clientY<100){
    rightClick++;

    if(rightClick>=5){

      const randomPercent=0.12+Math.random()*(0.16-0.12);
      const percentPerCamping=randomPercent/12;

      /* Mise à jour globale */
      await runTransaction(totalRef,current=>{
        const total=current||0;
        const subtract=Math.floor(total*randomPercent);
        return Math.max(0,total-subtract);
      });

      /* Mise à jour campings */
      const snapshot=await get(campingRef);
      const campings=snapshot.val();

      if(campings){
        const updates={};
        Object.keys(campings).forEach(key=>{
          const value=campings[key]||0;
          const subtract=Math.floor(value*percentPerCamping);
          updates[key]=Math.max(0,value-subtract);
        });
        await update(campingRef,updates);
      }

      rightClick=0;
    }

  } else rightClick=0;
});
</script>
</body>
</html>
